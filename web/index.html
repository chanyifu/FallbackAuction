<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FallbackAuction · 多场并发履约演示</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#131826; --panel2:#1a2133; --line:#263049;
    --text:#e6ecf7; --muted:#8b97b3; --cyan:#38e1c6; --amber:#f5b544;
    --green:#4ade80; --red:#f87171; --violet:#a78bfa; --gray:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1280px;margin:0 auto;padding:26px 22px 60px}
  header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}
  h1{font-size:21px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--muted)}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan)}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:13px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--cyan)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:#123f3a;border-color:#1f5149;color:var(--cyan)}
  .banner{background:#2a1212;border:1px solid #5a2222;color:var(--red);border-radius:12px;padding:12px 14px;font-size:13px;margin:12px 0;display:none}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:1080px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card-title{font-weight:700;font-size:15px}
  .tag{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid transparent}
  .tag.fallback{color:var(--cyan);border-color:#1f4d46;background:#102622}
  .tag.abort{color:var(--violet);border-color:#3d2f63;background:#1c1630}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--panel2);border-radius:12px;padding:10px 12px}
  .stat .k{color:var(--muted);font-size:11px}
  .stat .v{font-size:17px;font-weight:700}
  .stat .v small{font-size:11px;color:var(--muted);font-weight:400}
  .trail{display:flex;flex-wrap:wrap;gap:6px}
  .node{font-size:11px;padding:3px 9px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
  .node.cur{color:var(--text);border-color:var(--cyan);background:#102622}
  .node.done{color:var(--green);border-color:#1f5130}
  .node.bad{color:var(--red);border-color:#5a2222}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:600;font-size:11px}
  td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid transparent}
  .s-0{color:var(--cyan);border-color:#1f4d46;background:#102622}
  .s-1{color:var(--amber);border-color:#5a4417;background:#2a2110}
  .s-2{color:var(--green);border-color:#1f5130;background:#10261a}
  .s-3{color:var(--red);border-color:#5a2222;background:#2a1212}
  .s-4{color:var(--violet);border-color:#3d2f63;background:#1c1630}
  .s-5,.s-6{color:var(--gray);border-color:#2c3648;background:#161c28}
  .actions{display:flex;flex-wrap:wrap;gap:8px}
  .addr{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)}
  footer{margin-top:22px;color:var(--muted);font-size:12px}
  a{color:var(--cyan);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>FallbackAuction · 多场并发履约演示</h1>
      <div class="sub">分钟级闪拍 · 落槌后违约罚没 → 顺位递补 → 补款成交 / 流拍退款，链上状态机强制执行</div>
    </div>
    <span class="badge"><span class="dot"></span>本地 Hardhat · chainId 31337</span>
  </header>

  <div class="toolbar">
    <button id="runAll" class="primary">▶ 一键演示全部场次</button>
    <button id="refresh">刷新状态</button>
    <span id="clock" class="sub"></span>
  </div>
  <div id="banner" class="banner"></div>

  <div id="grid" class="grid"></div>

  <footer>
    合约：FallbackAuction · 测试网单场证据：
    <a href="https://testnet.monadscan.com/address/0x3fd84aa45a9fa5d8767214554711ea422a8ae191" target="_blank" rel="noopener">MonadScan 测试网</a>
  </footer>
</div>

<script src="/demo-manifest.js"></script>
<script>
const M = window.DEMO_MANIFEST;
const banner = document.getElementById("banner");

if (!M) {
  banner.style.display = "block";
  banner.textContent = "未找到演示清单。请先在 contracts/ 目录运行 node scripts/demo-multi.js 生成清单。";
} else {
  const RELAY = M.relay;
  const ROLE = {};
  M.accounts.forEach((a) => (ROLE[a.address.toLowerCase()] = a.role));
  const STATE_META = [
    ["OPEN", "s-0", "出价中"],
    ["PAYING", "s-1", "待付款"],
    ["WON", "s-2", "已成交"],
    ["DEFAULTED", "s-3", "已违约"],
    ["FALLBACK", "s-4", "递补中"],
    ["ABORTED", "s-5", "已流拍"],
    ["REFUNDED", "s-6", "已退款"],
  ];
  const MON = 10n ** 18n;
  const fmtMon = (wei) => (Number(wei) / 1e18).toFixed(2);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const short = (a) => a.slice(0, 6) + "…" + a.slice(-4);

  const cards = {};
  const grid = document.getElementById("grid");

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function buildCard(auction) {
    const card = el("div", "card");
    const head = el("div", "card-head");
    const title = el("div", "card-title", auction.label);
    const tag = el("span", "tag " + auction.scenario, auction.title);
    head.append(title, tag);

    const stats = el("div", "stats");
    const stBal = el("div", "stat"); stBal.append(el("div", "k", "合约余额"));
    const stBalV = el("div", "v", "–"); stBal.append(stBalV);
    const stCred = el("div", "stat"); stCred.append(el("div", "k", "受益人可提"));
    const stCredV = el("div", "v", "–"); stCred.append(stCredV);
    stats.append(stBal, stCred);

    const trail = el("div", "trail");
    const table = document.createElement("table");
    table.innerHTML = "<thead><tr><th>角色</th><th class='mono'>出价</th><th class='mono'>保证金</th><th>状态</th></tr></thead>";
    const tbody = document.createElement("tbody");
    table.append(tbody);

    const actions = el("div", "actions");
    const addr = el("div", "addr", auction.address);

    card.append(head, stats, trail, table, actions, addr);
    grid.append(card);
    cards[auction.address] = { auction, card, stBalV, stCredV, trail, tbody, actions };
  }

  async function fetchState(addr) {
    const r = await fetch(`${RELAY}/api/state?auction=${addr}`);
    if (!r.ok) throw new Error("state http " + r.status);
    return r.json();
  }

  async function act(addr, wallet, method, opts = {}) {
    const { args = [], value = "0", jumpSeconds = 0 } = opts;
    const r = await fetch(`${RELAY}/api/act`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ auction: addr, wallet, method, args, value, jumpSeconds }),
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "act failed");
    return j;
  }

  function bidStatus(b, winnerAddr) {
    if (b.paid) return ["已成交", "s-2"];
    if (!b.active && b.deposit === "0") return ["已退款/拒绝", "s-6"];
    if (!b.active) return ["已违约(罚没)", "s-3"];
    if (b.bidder.toLowerCase() === (winnerAddr || "").toLowerCase()) return ["当前中标", "s-1"];
    return ["候补", "s-0"];
  }

  function renderTrail(state) {
    const trail = cards[cardsKey].trail;
    trail.innerHTML = "";
    STATE_META.forEach(([key, cls, label], i) => {
      const n = el("span", "node", label);
      if (i === state) n.classList.add("cur");
      else if (i < state) n.classList.add(key === "DEFAULTED" ? "bad" : "done");
      trail.append(n);
    });
  }

  let cardsKey;
  function renderCard(auction, s) {
    const c = cards[auction.address];
    cardsKey = auction.address;
    c.stBalV.innerHTML = fmtMon(s.balance) + " <small>MON</small>";
    c.stCredV.innerHTML = fmtMon(s.credit) + " <small>MON</small>";
    renderTrail(s.state);

    c.tbody.innerHTML = "";
    s.bids.forEach((b) => {
      const role = ROLE[b.bidder.toLowerCase()] || short(b.bidder);
      const [label, cls] = bidStatus(b, s.winner.address);
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${role}</td><td class="mono">${fmtMon(b.price)}</td><td class="mono">${fmtMon(b.deposit)}</td><td><span class="pill ${cls}">${label}</span></td>`;
      c.tbody.append(tr);
    });

    // 上下文按钮
    c.actions.innerHTML = "";
    const addr = auction.address;
    const winnerRole = ROLE[s.winner.address.toLowerCase()];
    const winner = s.bids.find((b) => b.bidder.toLowerCase() === s.winner.address.toLowerCase());

    if (s.state === 0) {
      const b = el("button", "", "落槌（截止后结算）");
      b.onclick = async () => { await act(addr, "受益人", "settle", { jumpSeconds: 181 }); refresh(addr); };
      c.actions.append(b);
    } else if (s.state === 1) {
      const pay = el("button", "primary", `${winnerRole} 付尾款`);
      const remaining = winner ? BigInt(winner.price) - BigInt(winner.deposit) : 0n;
      pay.onclick = async () => { await act(addr, winnerRole, "pay", { value: remaining.toString() }); refresh(addr); };
      const def = el("button", "", "模拟超时违约");
      def.onclick = async () => { await act(addr, "受益人", "advanceFallback", { jumpSeconds: 121 }); refresh(addr); };
      c.actions.append(pay, def);
      // 候补拒绝（abort 场景递补到 C 时）
      if (auction.scenario === "abort" && winnerRole === "C") {
        const dec = el("button", "", "C 拒绝递补");
        dec.onclick = async () => { await act(addr, "C", "decline"); refresh(addr); };
        c.actions.append(dec);
      }
    } else if (s.state === 2) {
      const cBid = s.bids.find((b) => ROLE[b.bidder.toLowerCase()] === "C");
      if (cBid && cBid.active) {
        const rf = el("button", "", "C 退保证金");
        rf.onclick = async () => { await act(addr, "C", "refund"); refresh(addr); };
        c.actions.append(rf);
      }
      if (BigInt(s.credit) > 0n) {
        const wd = el("button", "primary", "受益人提款");
        wd.onclick = async () => { await act(addr, "受益人", "withdraw"); refresh(addr); };
        c.actions.append(wd);
      }
    } else if (s.state === 5) {
      if (BigInt(s.credit) > 0n) {
        const wd = el("button", "primary", "受益人提款罚没");
        wd.onclick = async () => { await act(addr, "受益人", "withdraw"); refresh(addr); };
        c.actions.append(wd);
      }
    }
  }

  async function refresh(addr) {
    const auction = M.auctions.find((a) => a.address === addr);
    try {
      const s = await fetchState(addr);
      renderCard(auction, s);
    } catch (e) {
      banner.style.display = "block";
      banner.textContent = "读取链上状态失败：" + e.message + "（确认中继 node scripts/demo-server.js 在运行）";
    }
  }

  async function refreshAll() {
    for (const a of M.auctions) await refresh(a.address);
    document.getElementById("clock").textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
  }

  async function runOne(auction) {
    const addr = auction.address;
    await act(addr, "受益人", "settle", { jumpSeconds: 181 });
    await refresh(addr); await sleep(1300);
    if (auction.scenario === "fallback") {
      await act(addr, "受益人", "advanceFallback", { jumpSeconds: 121 });
      await refresh(addr); await sleep(1300);
      const s = await fetchState(addr);
      const w = s.bids.find((b) => b.bidder.toLowerCase() === s.winner.address.toLowerCase());
      const remaining = BigInt(w.price) - BigInt(w.deposit);
      await act(addr, "B", "pay", { value: remaining.toString() });
      await refresh(addr); await sleep(1100);
      await act(addr, "C", "refund");
      await refresh(addr); await sleep(800);
      await act(addr, "受益人", "withdraw");
      await refresh(addr);
    } else {
      await act(addr, "受益人", "advanceFallback", { jumpSeconds: 121 });
      await refresh(addr); await sleep(1300);
      await act(addr, "受益人", "advanceFallback", { jumpSeconds: 121 });
      await refresh(addr); await sleep(1300);
      await act(addr, "C", "decline");
      await refresh(addr); await sleep(800);
      await act(addr, "受益人", "withdraw");
      await refresh(addr);
    }
  }

  async function runAll() {
    const btn = document.getElementById("runAll");
    btn.disabled = true;
    for (const a of M.auctions) {
      try { await runOne(a); } catch (e) { console.error(a.address, e); }
      await sleep(600);
    }
    btn.disabled = false;
  }

  M.auctions.forEach(buildCard);
  refreshAll();
  setInterval(refreshAll, 3000);
  document.getElementById("refresh").onclick = refreshAll;
  document.getElementById("runAll").onclick = runAll;
}
</script>
</body>
</html>
