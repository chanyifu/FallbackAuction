<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FallbackAuction · Monad 测试网六场观测</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#131826; --panel2:#1a2133; --line:#263049;
    --text:#e6ecf7; --muted:#8b97b3; --cyan:#38e1c6; --amber:#f5b544;
    --green:#4ade80; --red:#f87171; --violet:#a78bfa; --gray:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1280px;margin:0 auto;padding:26px 22px 60px}
  header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}
  h1{font-size:21px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--muted)}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:1080px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card-title{font-weight:700;font-size:15px}
  .tag{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid transparent}
  .tag.fallback{color:var(--cyan);border-color:#1f4d46;background:#102622}
  .tag.abort{color:var(--violet);border-color:#3d2f63;background:#1c1630}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--panel2);border-radius:12px;padding:10px 12px}
  .stat .k{color:var(--muted);font-size:11px}
  .stat .v{font-size:17px;font-weight:700}
  .stat .v small{font-size:11px;color:var(--muted);font-weight:400}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:600;font-size:11px}
  td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid transparent}
  .s-0{color:var(--cyan);border-color:#1f4d46;background:#102622}
  .s-1{color:var(--amber);border-color:#5a4417;background:#2a2110}
  .s-2{color:var(--green);border-color:#1f5130;background:#10261a}
  .s-3{color:var(--red);border-color:#5a2222;background:#2a1212}
  .s-4{color:var(--violet);border-color:#3d2f63;background:#1c1630}
  .s-5,.s-6{color:var(--gray);border-color:#2c3648;background:#161c28}
  .addr{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)}
  footer{margin-top:22px;color:var(--muted);font-size:12px}
  a{color:var(--cyan);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>FallbackAuction · 违约递补拍卖履约协议</h1>
      <div class="sub">链上只读观测 · Monad Testnet · 三场违约递补成交 + 三场双违约流拍退款，交易全部上链</div>
    </div>
    <span class="badge"><span class="dot"></span>Monad Testnet · chainId 10143</span>
  </header>

  <div id="grid" class="grid"></div>

  <footer>
    早期单场测试网证据：
    <a href="https://testnet.monadscan.com/address/0x3fd84aa45a9fa5d8767214554711ea422a8ae191" target="_blank" rel="noopener">0x3fd8…ae191</a>
    · 本页每 5 秒直连测试网 RPC 只读刷新，不做签名交易。
  </footer>
</div>

<script>
const RPC = "https://testnet-rpc.monad.xyz";
const AUCTIONS = [
  { label: "场次 1", scenario: "fallback", title: "违约递补成交", address: "0xe2e8ce3db727167be64ff990d2c1fed1f79c681f" },
  { label: "场次 2", scenario: "fallback", title: "违约递补成交", address: "0xf90bceb8382ace988fa0621e918e14bc3b69fc4b" },
  { label: "场次 3", scenario: "fallback", title: "违约递补成交", address: "0x226433ced2fb9eda7e61424d448d8857c7be9e92" },
  { label: "场次 4", scenario: "abort", title: "双违约流拍退款", address: "0xbd07d0fe5e6b6f180ba141f315e5125e6193b422" },
  { label: "场次 5", scenario: "abort", title: "双违约流拍退款", address: "0xbbbae379b62da16779f9f13c081e1a41e70ab4be" },
  { label: "场次 6", scenario: "abort", title: "双违约流拍退款", address: "0xbd916ba6ddc64427a17d7d47468e971f9688e58b" },
];
const ROLE = {
  "0xe9b912085ec50c378fb776bd697255133da215f3": "受益人",
  "0x6392e7832d6ddef84326c35715410e869209cf3": "A",
  "0xa716cdb0da67f729ab30d3ae9805b592165ca727": "B",
  "0xd07a1c5d40f7c3525ad0d2e02a19d67a2497f618": "C",
};
const STATE = [
  ["OPEN", "s-0", "出价中"],
  ["PAYING", "s-1", "待付款"],
  ["WON", "s-2", "已成交"],
  ["DEFAULTED", "s-3", "已违约"],
  ["FALLBACK", "s-4", "递补中"],
  ["ABORTED", "s-5", "已流拍"],
  ["REFUNDED", "s-6", "已退款"],
];
const SEL = {
  state: "0xc19d93fb",
  balance: "0x8b7afe2e",
  credit: "0x282f28d4",
  winner: "0x8e7ea5b2",
  bids: "0xb81c78ec",
};
const fmt = (wei) => (Number(wei) / 1e18).toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
const short = (a) => a.slice(0, 6) + "…" + a.slice(-4);
const words = (hex) => hex.slice(2).match(/.{64}/g) || [];
const addr = (w) => "0x" + w.slice(24);
const u256 = (w) => BigInt("0x" + w);
const isBool = (w) => w !== "0".padStart(64, "0");

async function call(contract, data) {
  const r = await fetch(RPC, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", method: "eth_call", params: [{ to: contract, data }, "latest"], id: 1 }),
  });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message);
  return j.result || "0x";
}

function bidStatus(b, winnerAddr) {
  if (b.paid) return ["已成交", "s-2"];
  if (!b.active && b.deposit === 0n) return ["已退款/拒绝", "s-6"];
  if (!b.active) return ["已违约(罚没)", "s-3"];
  if (b.bidder.toLowerCase() === (winnerAddr || "").toLowerCase()) return ["当前中标", "s-1"];
  return ["候补", "s-0"];
}

async function loadAuction(a) {
  const [stateHex, balHex, creditHex, winnerHex, bidsHex] = await Promise.all([
    call(a.address, SEL.state), call(a.address, SEL.balance), call(a.address, SEL.credit),
    call(a.address, SEL.winner), call(a.address, SEL.bids),
  ]);
  const state = Number(u256(words(stateHex)[0] || "0"));
  const [, cls, label] = STATE[state] || ["?", "s-5", "未知"];
  const ww = words(winnerHex);
  const winnerAddr = ww.length ? addr(ww[0]) : "0x0000000000000000000000000000000000000000";
  const bw = words(bidsHex);
  const n = Number(u256(bw[1] || "0"));
  const rows = [];
  for (let i = 0; i < n; i++) {
    const base = 2 + i * 5;
    const bidder = addr(bw[base]);
    const price = u256(bw[base + 1]);
    const deposit = u256(bw[base + 2]);
    const active = isBool(bw[base + 3]);
    const paid = isBool(bw[base + 4]);
    const b = { bidder, price, deposit, active, paid };
    const [st, bcls] = bidStatus(b, winnerAddr);
    const role = ROLE[bidder.toLowerCase()] || short(bidder);
    rows.push(`<tr>
      <td>${role}</td>
      <td class="mono">${fmt(price)}</td>
      <td class="mono">${fmt(deposit)}</td>
      <td><span class="pill ${bcls}">${st}</span></td></tr>`);
  }
  return { state, cls, label, bal: u256(words(balHex)[0] || "0"), credit: u256(words(creditHex)[0] || "0"), rows };
}

function cardShell(a) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="card-head">
      <div class="card-title">${a.label}</div>
      <span class="tag ${a.scenario}">${a.title}</span>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">合约状态</div><div class="v state">–</div></div>
      <div class="stat"><div class="k">受益人可提</div><div class="v credit">–</div></div>
    </div>
    <table>
      <thead><tr><th>角色</th><th class="mono">出价</th><th class="mono">保证金</th><th>状态</th></tr></thead>
      <tbody class="bids"><tr><td colspan="4" class="addr">读取中…</td></tr></tbody>
    </table>
    <div class="addr">${short(a.address)} · <a href="https://testnet.monadscan.com/address/${a.address}" target="_blank" rel="noopener">MonadScan</a></div>`;
  return card;
}

async function refreshAll() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const a of AUCTIONS) {
    const card = cardShell(a);
    grid.append(card);
    try {
      const r = await loadAuction(a);
      card.querySelector(".state").innerHTML = `<span class="pill ${r.cls}">${r.label}</span>`;
      card.querySelector(".credit").innerHTML = fmt(r.credit) + " <small>MON</small>";
      card.querySelector(".bids").innerHTML = r.rows.length ? r.rows.join("") : '<tr><td colspan="4" class="addr">暂无出价</td></tr>';
    } catch (e) {
      card.querySelector(".bids").innerHTML = `<tr><td colspan="4" class="addr">读取失败：${e.message}</td></tr>`;
    }
  }
}

refreshAll();
setInterval(refreshAll, 5000);
</script>
</body>
</html>
