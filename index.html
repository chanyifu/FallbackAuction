<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FallbackAuction · Monad 测试网观测页</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#131826; --panel2:#1a2133; --line:#263049;
    --text:#e6ecf7; --muted:#8b97b3; --cyan:#38e1c6; --amber:#f5b544;
    --green:#4ade80; --red:#f87171; --violet:#a78bfa; --gray:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:920px;margin:0 auto;padding:26px 22px 60px}
  header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}
  h1{font-size:21px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--muted)}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:680px){.stats{grid-template-columns:1fr}}
  .stat{background:var(--panel2);border-radius:12px;padding:12px 14px}
  .stat .k{color:var(--muted);font-size:11px}
  .stat .v{font-size:19px;font-weight:700}
  .stat .v small{font-size:11px;color:var(--muted);font-weight:400}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:600;font-size:11px}
  td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid transparent}
  .s-0{color:var(--cyan);border-color:#1f4d46;background:#102622}
  .s-1{color:var(--amber);border-color:#5a4417;background:#2a2110}
  .s-2{color:var(--green);border-color:#1f5130;background:#10261a}
  .s-3{color:var(--red);border-color:#5a2222;background:#2a1212}
  .s-4{color:var(--violet);border-color:#3d2f63;background:#1c1630}
  .s-5,.s-6{color:var(--gray);border-color:#2c3648;background:#161c28}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;color:var(--muted);font-size:12px}
  .meta b{color:var(--text);font-weight:600}
  a{color:var(--cyan);text-decoration:none}
  .note{color:var(--muted);font-size:12px;margin-top:10px}
  .addr{font-family:ui-monospace,Menlo,monospace;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>FallbackAuction · 违约递补拍卖履约协议</h1>
      <div class="sub">链上只读观测 · Monad Testnet · 落槌后违约罚没 → 顺位递补 → 补款成交 / 流拍退款</div>
    </div>
    <span class="badge"><span class="dot"></span>Monad Testnet · chainId 10143</span>
  </header>

  <div class="card">
    <div class="stats">
      <div class="stat"><div class="k">合约状态</div><div class="v" id="state">–</div></div>
      <div class="stat"><div class="k">合约余额（托管保证金）</div><div class="v" id="balance">– <small>MON</small></div></div>
      <div class="stat"><div class="k">受益人可提金额</div><div class="v" id="credit">– <small>MON</small></div></div>
    </div>
  </div>

  <div class="card">
    <div class="meta" id="meta"></div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>出价人</th><th class="mono">出价</th><th class="mono">保证金</th><th>状态</th></tr></thead>
      <tbody id="bids"><tr><td colspan="4" class="note">读取中…</td></tr></tbody>
    </table>
    <div class="note">交互操作（落槌 / 付尾款 / 递补 / 退款 / 提款）在本地六场并发演示环境中完成；本页仅只读展示测试网链上状态，每 5 秒刷新。</div>
  </div>

  <div class="note">
    合约：<span class="addr" id="contract"></span> ·
    <a id="explorer" target="_blank" rel="noopener">MonadScan 测试网</a>
  </div>
</div>

<script>
const RPC = "https://testnet-rpc.monad.xyz";
const CONTRACT = "0x3fd84aa45a9fa5d8767214554711ea422a8ae191";
const STATE = [
  ["OPEN", "s-0", "出价中"],
  ["PAYING", "s-1", "待付款"],
  ["WON", "s-2", "已成交"],
  ["DEFAULTED", "s-3", "已违约"],
  ["FALLBACK", "s-4", "递补中"],
  ["ABORTED", "s-5", "已流拍"],
  ["REFUNDED", "s-6", "已退款"],
];
const SEL = {
  state: "0xc19d93fb",
  balance: "0x8b7afe2e",
  credit: "0x282f28d4",
  winner: "0x8e7ea5b2",
  bids: "0xb81c78ec",
  params: "0xcff0ab96",
};

const MON = 10n ** 18n;
const fmt = (wei) => (Number(wei) / 1e18).toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
const short = (a) => a.slice(0, 6) + "…" + a.slice(-4);

async function call(data) {
  const r = await fetch(RPC, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", method: "eth_call", params: [{ to: CONTRACT, data }, "latest"], id: 1 }),
  });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message);
  return j.result || "0x";
}
const words = (hex) => hex.slice(2).match(/.{64}/g) || [];
const addr = (w) => "0x" + w.slice(24);
const u256 = (w) => BigInt("0x" + w);
const isBool = (w) => w !== "0".padStart(64, "0");

async function load() {
  const [stateHex, balHex, creditHex, winnerHex, bidsHex, paramsHex] = await Promise.all([
    call(SEL.state), call(SEL.balance), call(SEL.credit),
    call(SEL.winner), call(SEL.bids), call(SEL.params),
  ]);

  const state = Number(u256(words(stateHex)[0] || "0"));
  const [, cls, label] = STATE[state] || ["?", "s-5", "未知"];
  document.getElementById("state").innerHTML = `<span class="pill ${cls}">${label}</span>`;
  document.getElementById("balance").innerHTML = fmt(u256(words(balHex)[0] || "0")) + " <small>MON</small>";
  document.getElementById("credit").innerHTML = fmt(u256(words(creditHex)[0] || "0")) + " <small>MON</small>";

  // params: beneficiary, itemUriOffset, startPrice, minIncrement, bidDeadline, payWindow, depositBps, maxBidders
  const pw = words(paramsHex);
  const beneficiary = addr(pw[0]);
  const startPrice = u256(pw[2]), minInc = u256(pw[3]);
  const payWindow = u256(pw[5]), depositBps = u256(pw[6]), maxBidders = u256(pw[7]);
  document.getElementById("meta").innerHTML = `
    <div>受益人：<b class="addr">${beneficiary}</b></div>
    <div>起拍价：<b>${fmt(startPrice)} MON</b> · 最小加价：<b>${fmt(minInc)} MON</b></div>
    <div>保证金比例：<b>${Number(depositBps) / 100}%</b> · 人数上限：<b>${Number(maxBidders)}</b></div>
    <div>付款窗口：<b>${Number(payWindow)} 秒</b></div>`;

  // winner: address, price, deposit
  const ww = words(winnerHex);
  const winnerAddr = ww.length ? addr(ww[0]) : "0x0000000000000000000000000000000000000000";

  // bids tuple[]: offset, length, then 5 words per entry
  const bw = words(bidsHex);
  const n = Number(u256(bw[1] || "0"));
  const rows = [];
  for (let i = 0; i < n; i++) {
    const base = 2 + i * 5;
    const bidder = addr(bw[base]);
    const price = u256(bw[base + 1]);
    const deposit = u256(bw[base + 2]);
    const active = isBool(bw[base + 3]);
    const paid = isBool(bw[base + 4]);
    let st, cls;
    if (paid) { st = "已成交"; cls = "s-2"; }
    else if (!active && deposit === 0n) { st = "已退款/拒绝"; cls = "s-6"; }
    else if (!active) { st = "已违约(罚没)"; cls = "s-3"; }
    else if (bidder.toLowerCase() === winnerAddr.toLowerCase()) { st = "当前中标"; cls = "s-1"; }
    else { st = "候补"; cls = "s-0"; }
    rows.push(`<tr>
      <td class="mono">${short(bidder)}</td>
      <td class="mono">${fmt(price)}</td>
      <td class="mono">${fmt(deposit)}</td>
      <td><span class="pill ${cls}">${st}</span></td></tr>`);
  }
  document.getElementById("bids").innerHTML = rows.length ? rows.join("") : '<tr><td colspan="4" class="note">暂无出价</td></tr>';

  document.getElementById("contract").textContent = CONTRACT;
  document.getElementById("explorer").href = "https://testnet.monadscan.com/address/" + CONTRACT;
}

load().catch((e) => {
  document.getElementById("bids").innerHTML = `<tr><td colspan="4" class="note">读取失败：${e.message}</td></tr>`;
});
setInterval(load, 5000);
</script>
</body>
</html>
